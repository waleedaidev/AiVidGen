services:
  postgres:
    image: postgres:16-alpine
    container_name: aividgen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aividgen
      POSTGRES_PASSWORD: aividgen
      POSTGRES_DB: aividgen
    ports:
      - "55490:5432"
    volumes:
      - aividgen_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aividgen-redis
    restart: unless-stopped
    ports:
      - "56379:6379"
    volumes:
      - aividgen_redis:/data
    command: redis-server --appendonly yes

volumes:
  aividgen_pgdata:
  aividgen_redis:
