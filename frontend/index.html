<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AiVidGen</title>
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <main class="landing">
    <h1>Turn one idea into a video ad</h1>
    <p class="sub">Tell us what you want to make. We'll start building it right now.</p>
    <form id="start-form">
      <textarea id="prompt" placeholder="e.g. A 15 second ad for my new coffee shop, warm and inviting vibe" rows="3" required></textarea>
      <button type="submit" id="start-btn">Start my video</button>
    </form>
    <p id="error" class="error" hidden></p>
  </main>

  <script src="/static/js/landing.js"></script>
</body>
</html>
